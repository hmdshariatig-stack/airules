[tool.pytest]
# Python test configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = []
python_functions = []
ignore = []
markers =
    slow: marks tests as slow
    integration: marks tests as integration
    unit: marks tests as unit
    e2e: marks tests as e2e
filterwarnings =
    default
    error
    always
    default::DeprecationWarning
    error::DeprecationWarning
    always::PendingDeprecationWarning
    error::PendingDeprecationWarning
    default::ResourceWarning
    error::ResourceWarning
    default::UnicodeWarning
    error::UnicodeWarning
default_test_dir = tests
rootdir = .
usecfi = false
enable_plugins =
    pytest-ordering
    pytest-cov
    pytest-xdist
    pytest-mock
python_classes = []
python_functions = []
norecursedirs =
    .git
    __pycache__
    .egg
    .eggs
    parts
    build
    dist
srcdir = .
confcutdir = .
basetemp = .pytest
cache_dir = .cache
log_cli =
    "plugins"
    "config"
    "dupnames"
    "doctest"
    "fixtures"
    "ext"
    "factories"
    "globally"
    "imports"
    "iso-8859-1"
    "marker"
    "misc"
    "non-str"
    "numeric"
    "numeric-error"
    "obj"
    "profile"
    "skipping"
    "resolution"
    "section"
    "settings"
    "sort-extra-keywords"
    "summary"
    "terminal-seen"
    "time"
    "timings"
    "warnings"
log_cli_date_format = "%Y-%m-%dT%H:%M:%S"
log_cli_size = "small"
log_file = None
log_cli_style = None
asyncio_mode = auto
test_discovery_ignore = [r"^test_.*_next\.py$"]
test_discovery_max_cases = 0
test_discovery_ignore_globs = []
test_discovery_ignore_around_globs = []
